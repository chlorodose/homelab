apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: synapse
spec:
  url: https://ananace.gitlab.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: synapse
spec:
  chart: matrix-synapse
  sourceRef:
    kind: HelmRepository
    name: synapse
  version: "^3.12"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synapse
spec:
  targetNamespace: service
  chartRef:
    kind: HelmChart
    name: synapse
  values:
    image:
      repository: docker.io/dotwee/matrix-synapse-s3
    signingkey:
      job:
        enabled: false
      existingSecret: synapse-key
      existingSecretKey: key
    serverName: "lilith-aster.me"
    publicServerName: "matrix.lilith-aster.me"
    config:
      publicBaseurl: "https://matrix.lilith-aster.me"
      enableRegistration: false
      trustedKeyServers:
        - server_name: matrix.org
      useStructuredLogging: true
    extraConfig:
      matrix_authentication_service:
        enabled: true
        endpoint: http://mas.service.svc:8080/
        secret_path: /run/mas/matrix-secret
      password_config:
        enabled: false
      enable_3pid_changes: false
      presence:
        enabled: true
      allow_public_rooms_without_auth: true
      allow_public_rooms_over_federation: true
    extraSecrets:
      oidc_providers: []
      media_storage_providers:
        - module: s3_storage_provider.S3StorageProviderBackend
          store_local: true
          store_remote: true
          store_synchronous: true
          config:
            bucket: synapse
            endpoint_url: "http://seaweed-s3.database.svc:8333"
            access_key_id: "@@S3_KEY_ID@@"
            secret_access_key: "@@S3_KEY_SECRET@@"
    synapse:
      extraVolumes:
        - name: certs
          secret:
            secretName: postgres-synapse
            defaultMode: 0400
        - name: mas-key
          secret:
            secretName: mas-keys
            items:
              - key: matrix-secret
                path: matrix-secret
        - name: s3-key
          secret:
            secretName: seaweed-synapse-key
      extraVolumeMounts:
        - name: certs
          mountPath: /run/certs
          readOnly: true
        - name: mas-key
          mountPath: /run/mas
          readOnly: true
        - name: s3-key
          mountPath: /run/s3
      extraCommands:
        - sed -i "s|@@S3_KEY_ID@@|$(cat /run/s3/accessKey)|g" /synapse/config/conf.d/secrets.yaml
        - sed -i "s|@@S3_KEY_SECRET@@|$(cat /run/s3/secretKey)|g" /synapse/config/conf.d/secrets.yaml
    postgresql:
      enabled: false
    externalPostgresql:
      host: "postgres-rw.database.svc"
      port: 5432
      username: synapse
      database: synapse
      existingSecret: synapse-database-token
      existingSecretPasswordKey: password
    externalRedis:
      host: "synapse-redis.service.svc"
      port: 6379
      existingSecret: synapse-database-token
      existingSecretPasswordKey: password
    redis:
      enabled: false
    persistence:
      enabled: false
    ingress:
      enabled: false
    serviceAccount:
      create: true
---
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: synapse-database-token
  namespace: database
  labels:
    cnpg.io/reload: "true"
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "service"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "service"
    secret-generator.v1.mittwald.de/autogenerate: password
    secret-generator.v1.mittwald.de/encoding: hex
stringData:
  username: synapse
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: synapse
  namespace: database
spec:
  name: synapse
  owner: synapse
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: synapse
  namespace: database
spec:
  cluster:
    name: postgres
  name: synapse
  login: true
  superuser: false
  createdb: false
  databaseRoleReclaimPolicy: delete
  passwordSecret:
    name: synapse-database-token
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: synapse-redis
  namespace: service
spec:
  replicas: 1
  args:
    - --proactor_threads=2
  authentication:
    passwordFromSecret:
      name: synapse-database-token
      key: password
---
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: synapse
  namespace: database
spec:
  clusterRef:
    name: seaweed
  reclaimPolicy: Retain
  adoptExisting: true
  versioning: Off
  objectLock: false
  quota:
    size: 128Gi
    enforce: true
  owner: synapse
  access:
    - user: synapse
      actions: [Read, Write, List]
  placement:
    fsync: false
    worm: false
    readOnly: false
  anonymousRead: false
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: synapse
  namespace: database
spec:
  seaweedRef:
    name: seaweed
---
apiVersion: seaweed.seaweedfs.com/v1
kind: ResourceReferenceGrant
metadata:
  name: allow-synapse-from-service
  namespace: database
spec:
  from:
    - group: seaweed.seaweedfs.com
      kind: S3Credentials
      namespace: service
  to:
    - group: seaweed.seaweedfs.com
      kind: S3Identity
      name: synapse
---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: synapse
  namespace: service
spec:
  seaweedRef:
    name: seaweed
    namespace: database
  identityRef:
    name: synapse
  secretRef:
    name: seaweed-synapse-key
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: from-gateway-to-synapse
  namespace: service
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: manager
  to:
    - group: ""
      kind: Service
      name: synapse-matrix-synapse
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: manager
spec:
  parentRefs:
    - name: default
  hostnames:
    - matrix.lilith-aster.me
  rules:
    # Authentication compatibility endpoints take precedence over /_matrix.
    - matches:
        - path:
            type: RegularExpression
            value: ^/_matrix/client/[^/]+/(login|logout|refresh)(/.*)?$
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: mas
          namespace: service
          port: 8080
    - timeouts:
        request: 120s
        backendRequest: 120s
      matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse/client
        - path:
            type: Exact
            value: /.well-known/matrix/client
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: "X-Forwarded-Proto"
                value: "https"
      backendRefs:
        - name: synapse-matrix-synapse
          namespace: service
          kind: Service
          port: 8008
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: mas
          namespace: service
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /.well-known/matrix/server
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: synapse-well-known-server
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: synapse-well-known-server
  namespace: manager
spec:
  directResponse:
    statusCode: 200
    contentType: application/json
    body:
      type: Inline
      inline: |
        {
            "m.server": "matrix.lilith-aster.me:443"
        }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-well-known
  namespace: manager
spec:
  parentRefs:
    - name: default
  hostnames:
    - lilith-aster.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/matrix
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: matrix.lilith-aster.me
            statusCode: 302
