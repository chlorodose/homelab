# Static site for lilith-aster.me. Content lives in ConfigMaps generated by
# kustomization.yaml; run scripts/www-bundle.py to publish or update a page.
# Each page directory needs its own volume below and a location in nginx.conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  namespace: service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: www
  template:
    metadata:
      labels:
        app.kubernetes.io/name: www
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine-slim
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: root
              mountPath: /srv/root
              readOnly: true
            - name: page-paperclip520
              mountPath: /srv/PAPERCLIP520
              readOnly: true
            - name: assets
              mountPath: /srv/assets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx
          configMap:
            name: www-nginx
        - name: root
          configMap:
            name: www-root
        - name: page-paperclip520
          configMap:
            name: www-page-paperclip520
        - name: assets
          configMap:
            name: www-assets
---
apiVersion: v1
kind: Service
metadata:
  name: www
  namespace: service
spec:
  selector:
    app.kubernetes.io/name: www
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: from-gateway-to-www
  namespace: service
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: manager
  to:
    - group: ""
      kind: Service
      name: www
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-expose
  namespace: manager
spec:
  parentRefs:
    - name: default
  hostnames:
    - lilith-aster.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: www
          namespace: service
          kind: Service
          port: 80
