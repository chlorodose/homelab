server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    server_tokens off;

    location / {
        root /srv/root;
        add_header Cache-Control "no-cache";
    }

    location = /PAPERCLIP520 {
        return 301 /PAPERCLIP520/;
    }

    location /PAPERCLIP520/ {
        root /srv;
        add_header Cache-Control "no-cache";
    }

    # Content-addressed (sha256) files never change under the same name.
    location /asserts/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
