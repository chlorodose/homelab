---
# Switch (Sirivision SR-S25G3412FPB, switch.internal.lilith-aster.me): interface
# counters via SNMP v2c (read-only community, snmp-exporter) and PoE / CPU / memory
# via a small exporter that logs into the web UI. Credentials for the web UI live in
# the `switch-credentials` Secret (secrets/switch.env).
apiVersion: v1
kind: ConfigMap
metadata:
  name: switch-snmp-exporter
  namespace: service
data:
  snmp.yml: |
    auths:
      public_v2:
        community: public
        version: 2
    modules:
      switch:
        retries: 1
        timeout: 5s
        max_repetitions: 25
        walk:
          - 1.3.6.1.2.1.1.3
          - 1.3.6.1.2.1.10.7.2.1.10
          - 1.3.6.1.2.1.10.7.2.1.11
          - 1.3.6.1.2.1.10.7.2.1.13
          - 1.3.6.1.2.1.10.7.2.1.16
          - 1.3.6.1.2.1.10.7.2.1.18
          - 1.3.6.1.2.1.10.7.2.1.19
          - 1.3.6.1.2.1.10.7.2.1.2
          - 1.3.6.1.2.1.10.7.2.1.3
          - 1.3.6.1.2.1.10.7.2.1.8
          - 1.3.6.1.2.1.10.7.2.1.9
          - 1.3.6.1.2.1.17.2.15.1.3
          - 1.3.6.1.2.1.17.2.3
          - 1.3.6.1.2.1.17.2.4
          - 1.3.6.1.2.1.17.7.1.1.4
          - 1.3.6.1.2.1.17.7.1.2.1.1.2
          - 1.3.6.1.2.1.2.2.1.13
          - 1.3.6.1.2.1.2.2.1.14
          - 1.3.6.1.2.1.2.2.1.19
          - 1.3.6.1.2.1.2.2.1.20
          - 1.3.6.1.2.1.2.2.1.7
          - 1.3.6.1.2.1.2.2.1.8
          - 1.3.6.1.2.1.2.2.1.9
          - 1.3.6.1.2.1.31.1.1.1.1
          - 1.3.6.1.2.1.31.1.1.1.10
          - 1.3.6.1.2.1.31.1.1.1.11
          - 1.3.6.1.2.1.31.1.1.1.12
          - 1.3.6.1.2.1.31.1.1.1.13
          - 1.3.6.1.2.1.31.1.1.1.18
          - 1.3.6.1.2.1.31.1.1.1.6
          - 1.3.6.1.2.1.31.1.1.1.7
          - 1.3.6.1.2.1.31.1.1.1.8
          - 1.3.6.1.2.1.31.1.1.1.9
        metrics:
          - name: switch_if_admin_status
            oid: 1.3.6.1.2.1.2.2.1.7
            type: gauge
            help: "Administrative state: 1 up, 2 down, 3 testing."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifAlias
                oid: 1.3.6.1.2.1.31.1.1.1.18
                type: DisplayString
          - name: switch_if_oper_status
            oid: 1.3.6.1.2.1.2.2.1.8
            type: gauge
            help: "Operational state: 1 up, 2 down, 7 lowerLayerDown."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifAlias
                oid: 1.3.6.1.2.1.31.1.1.1.18
                type: DisplayString
          - name: switch_if_last_change_ticks
            oid: 1.3.6.1.2.1.2.2.1.9
            type: gauge
            help: "sysUpTime (1/100 s) when the interface last changed state."
            indexes:
              - labelname: ifIndex
                type: gauge
            lookups:
              - labels: [ifIndex]
                labelname: ifName
                oid: 1.3.6.1.2.1.31.1.1.1.1
                type: DisplayString
              - labels: [ifIndex]
                labelname: ifAlias
                oid: 1.3.6.1.2.1.31.1.1.1.18
                type: DisplayString
          - name: switch_if_in_discards_total
            oid: 1.3.6.1.2.1.2.2.1.13
            type: counter
            help: "Inbound packets discarded."
            indexes:
