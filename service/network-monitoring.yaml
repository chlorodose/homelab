apiVersion: v1
kind: ConfigMap
metadata:
  name: switch-exporter
  namespace: service
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Prometheus exporter for the PoE and CPU/memory data of a Sirivision switch web UI.

    Interface counters come from SNMP (snmp-exporter); the web UI is the only source of
    PoE and CPU/memory. The UI authenticates by source IP, so one login serves every
    later request until the switch reports `logout`.
    """
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    BASE = os.environ["SWITCH_URL"].rstrip("/")
    USER = os.environ["SWITCH_USERNAME"]
    PASSWORD = os.environ["SWITCH_PASSWORD"]
    CACHE_TTL = float(os.environ.get("CACHE_TTL", "10"))

    # The switch serves a self-signed certificate and speaks only TLS 1.2 with static-RSA
    # AES-GCM suites, which a current OpenSSL does not offer by default.
    CTX = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode = ssl.CERT_NONE
    CTX.maximum_version = ssl.TLSVersion.TLSv1_2
    CTX.set_ciphers("AES256-GCM-SHA384:AES128-GCM-SHA256:@SECLEVEL=0")

    lock = threading.Lock()
    cache = (0.0, "")


    def request(url, data=None):
        body = urllib.parse.urlencode(data).encode() if data is not None else None
        with urllib.request.urlopen(urllib.request.Request(url, body), timeout=10, context=CTX) as r:
            return r.read().decode("utf-8", "replace")


    def login():
        resp = request(
            f"{BASE}/cgi/set.cgi?cmd=home_loginAuth&dummy={int(time.time() * 1000)}",
            {"username": USER, "password": PASSWORD},
        )
        if json.loads(resp).get("status") != "ok":
            raise RuntimeError("login rejected")


    def get(cmd):
        for attempt in (0, 1):
            data = json.loads(request(f"{BASE}/cgi/get.cgi?cmd={cmd}"))
            if not data.get("logout"):
                return data["data"]
            if attempt:
                break
            login()
        raise RuntimeError("session rejected for " + cmd)


    def esc(v):
        return str(v).replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")


    class Out:
        def __init__(self):
            self.lines = []
            self.seen = set()

        def add(self, name, value, help_, **labels):
            if name not in self.seen:
                self.seen.add(name)
                self.lines.append(f"# HELP {name} {help_}")
                self.lines.append(f"# TYPE {name} gauge")
            lbl = ",".join(f'{k}="{esc(v)}"' for k, v in labels.items())
            self.lines.append(f"{name}{{{lbl}}} {value}" if lbl else f"{name} {value}")


    def collect():
        o = Out()
        t0 = time.time()
        try:
            cpumem = get("sys_cpumem")
            poe = get("poe_port")
            panel = get("panel_info")
        except Exception as e:  # noqa: BLE001 - any failure means the web UI is not scrapable
            print("scrape failed:", repr(e), flush=True)
            o.add("switch_web_up", 0, "Whether the switch web UI was scraped successfully.")
            o.add("switch_web_scrape_duration_seconds", round(time.time() - t0, 3), "Scrape duration.")
            return "\n".join(o.lines) + "\n"

        o.add("switch_web_up", 1, "Whether the switch web UI was scraped successfully.")
        o.add("switch_cpu_usage_ratio", cpumem["cpu"] / 100, "CPU utilisation.")
        o.add("switch_memory_usage_ratio", cpumem["mem"] / 100, "Memory utilisation.")

        o.add("switch_poe_budget_watts", poe["total_p"], "Total PoE power budget.")
        o.add("switch_poe_consumption_watts", float(poe["power_consum"]), "Total PoE power drawn.")
        o.add("switch_poe_voltage_volts", float(poe["total_v"]), "PoE supply voltage.")
        for port in poe["ports"]:
            # PoE ports 0-7 are the first eight interfaces, so ifIndex is idx + 1.
            labels = {"ifIndex": port["idx"] + 1, "ifAlias": port["descp"]}
            o.add("switch_poe_port_power_watts", float(port["power"]), "PoE power drawn by the port.", **labels)
            o.add("switch_poe_port_current_amperes", float(port["current"]), "PoE current drawn by the port.", **labels)
            o.add("switch_poe_port_voltage_volts", float(port["voltage"]), "PoE voltage on the port.", **labels)
            o.add("switch_poe_port_delivering", int(port["operation"] == "On"), "1 when the port is delivering PoE.", **labels)
            o.add("switch_poe_port_class", int(port["class"]), "Powered device class.", **labels)
        # The SNMP speed columns are unusable on this firmware; the panel view has the real value.
        for i, port in enumerate(panel["ports"]):
            up = bool(port.get("linkup"))
            o.add("switch_port_link_up", int(up), "1 when the port has link.", ifIndex=i + 1)
            o.add("switch_port_speed_mbps", int(port.get("speed", 0)) if up else 0,
                  "Negotiated speed in Mbit/s, 0 without link.", ifIndex=i + 1)
        o.add("switch_web_scrape_duration_seconds", round(time.time() - t0, 3), "Scrape duration.")
        return "\n".join(o.lines) + "\n"


    def metrics():
        global cache
        with lock:
            ts, body = cache
            if time.time() - ts > CACHE_TTL:
                body = collect()
                cache = (time.time(), body)
            return body


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):  # noqa: N802
            if self.path == "/metrics":
                body, code = metrics().encode(), 200
            elif self.path == "/healthz":
                body, code = b"ok\n", 200
            else:
                body, code = b"not found\n", 404
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "9878"))), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switch-exporter
  namespace: service
  labels:
    app.kubernetes.io/name: switch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switch-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.14.10-alpine3.24
          command: ["python3", "-I", "/app/exporter.py"]
          env:
            - name: SWITCH_URL
              value: https://192.168.0.199
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: switch-credentials
          ports:
            - name: metrics
              containerPort: 9878
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: switch-exporter
