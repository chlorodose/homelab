apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: switch
  namespace: manager
spec:
  groups:
    - name: switch
      rules:
        - alert: SwitchSnmpDown
          expr: up{job="switch-snmp"} == 0 or absent(up{job="switch-snmp"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch cannot be polled over SNMP (switch down, SNMP disabled, or exporter down)"
        - alert: SwitchWebDown
          expr: switch_web_up == 0 or absent(switch_web_up)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Switch web UI cannot be scraped (PoE and CPU metrics are missing)"
        - alert: SwitchRebooted
          expr: switch_uptime_ticks < 30000
          labels:
            severity: warning
          annotations:
            summary: "Switch rebooted within the last 5 minutes"
        # Only ports with a description are in use; SE4 ("mirrored") and the PC port
        # are expected to go down, so they are left out.
        - alert: SwitchUplinkDown
          expr: |
            switch_if_oper_status{ifAlias=~"routers?|modem|AP|NAS"} != 1
            and on(ifIndex) switch_if_admin_status == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} ({{ $labels.ifAlias }}) is down"
        # Expected speeds: modem and NAS ports run 10G, routers and AP 2.5G.
        - alert: SwitchUplinkSpeedLow
          expr: |
            (switch_port_speed_mbps > 0 < 10000)
              * on(ifIndex) group_left(ifName, ifAlias) (switch_if_admin_status{ifAlias=~"modem|NAS"} == 1)
            or
            (switch_port_speed_mbps > 0 < 2500)
              * on(ifIndex) group_left(ifName, ifAlias) (switch_if_admin_status{ifAlias=~"routers?|AP"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} ({{ $labels.ifAlias }}) negotiated only {{ $value }} Mbit/s"
        - alert: SwitchLinkFlapping
          expr: changes(switch_if_oper_status{ifName!~"LAG.*"}[30m]) > 4
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} ({{ $labels.ifAlias }}) changed state {{ $value }} times in 30m"
        - alert: SwitchPortErrors
          expr: |
            increase(switch_if_in_errors_total{ifName!~"LAG.*"}[15m]) > 20
            or increase(switch_if_out_errors_total{ifName!~"LAG.*"}[15m]) > 20
            or increase(switch_dot3_fcs_errors_total{ifName!~"LAG.*"}[15m]) > 20
            or increase(switch_dot3_symbol_errors_total{ifName!~"LAG.*"}[15m]) > 20
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} ({{ $labels.ifAlias }}) is logging errors (bad cable or SFP?)"
        - alert: SwitchPortHalfDuplex
          expr: switch_dot3_duplex{ifName!~"LAG.*"} == 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} ({{ $labels.ifAlias }}) negotiated half duplex"
        - alert: SwitchBroadcastStorm
          expr: |
            sum by (ifName, ifAlias) (
              rate(switch_if_in_broadcast_packets_total{ifName!~"LAG.*"}[5m])
              + rate(switch_if_in_multicast_packets_total{ifName!~"LAG.*"}[5m])
            ) > 20000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Switch port {{ $labels.ifName }} receives {{ $value | humanize }} broadcast/multicast packets/s (loop?)"
        - alert: SwitchTopologyChange
          expr: increase(switch_stp_topology_changes_total[10m]) > 0
          labels:
            severity: info
          annotations:
            summary: "Switch STP topology changed"
        - alert: SwitchCpuHigh
          expr: switch_cpu_usage_ratio > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Switch CPU is at {{ $value | humanizePercentage }}"
        - alert: SwitchMemoryHigh
          expr: switch_memory_usage_ratio > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Switch memory is at {{ $value | humanizePercentage }}"
        - alert: SwitchPoeBudgetHigh
          expr: switch_poe_consumption_watts / switch_poe_budget_watts > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Switch PoE load is at {{ $value | humanizePercentage }} of the budget"
---
