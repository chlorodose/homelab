apiVersion: apps/v1
kind: Deployment
metadata:
  name: switch-snmp
  namespace: service
  labels:
    app.kubernetes.io/name: switch-snmp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switch-snmp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switch-snmp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.31.0
          args:
            - --config.file=/config/snmp.yml
          ports:
            - name: metrics
              containerPort: 9116
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: switch-snmp-exporter
---
