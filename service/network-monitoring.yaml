# Network device monitoring: scrape exporters, alert rules and Grafana dashboards
# for the XGS-PON SFP modem (modem.local) and the switch (switch.internal.lilith-aster.me).
#
# Modem (8311 community firmware):
# The modem has no metrics endpoint, so a small exporter logs into its LuCI web UI
# and turns the PON status pages into Prometheus metrics. Credentials live in the
# `modem-credentials` Secret (secrets/modem.env), never in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: modem-exporter
  namespace: service
data:
  exporter.py: |
    #!/usr/bin/env python3
    """Prometheus exporter for an 8311-firmware XGS-PON SFP modem, scraped via its LuCI web UI."""
    import http.cookiejar
    import json
    import os
    import re
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    BASE = os.environ["MODEM_URL"].rstrip("/")
    USER = os.environ["MODEM_USERNAME"]
    PASSWORD = os.environ["MODEM_PASSWORD"]
    CACHE_TTL = float(os.environ.get("CACHE_TTL", "10"))
    LUCI = BASE + "/cgi-bin/luci"
    ADMIN = LUCI + "/admin/8311/"

    lock = threading.Lock()
    cache = (0.0, "")


    class Session:
        def __init__(self):
            self.opener = None

        def login(self):
            jar = http.cookiejar.CookieJar()
            self.opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
            data = urllib.parse.urlencode({"luci_username": USER, "luci_password": PASSWORD}).encode()
            # A successful login answers 302 with a sysauth cookie, which urllib then follows.
            self.opener.open(LUCI + "/", data, timeout=10).read()
            if not any(c.name == "sysauth" for c in jar):
                raise RuntimeError("login failed: no sysauth cookie")

        def get(self, url):
            for attempt in (0, 1):
                if self.opener is None:
                    self.login()
                try:
                    body = self.opener.open(url, timeout=10).read().decode("utf-8", "replace")
                    # An expired session serves the login form instead of the data.
                    if "luci_password" not in body:
                        return body
                except urllib.error.HTTPError as e:
                    if e.code != 403:
                        raise
                if attempt:
                    break
                self.opener = None
            raise RuntimeError("session rejected for " + url)


    session = Session()


    def esc(v):
        return str(v).replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")


    class Out:
        def __init__(self):
            self.lines = []
            self.seen = set()

        def add(self, name, value, help_, typ="gauge", **labels):
            if name not in self.seen:
                self.seen.add(name)
                self.lines.append(f"# HELP {name} {help_}")
                self.lines.append(f"# TYPE {name} {typ}")
            lbl = ",".join(f'{k}="{esc(v)}"' for k, v in labels.items())
            self.lines.append(f"{name}{{{lbl}}} {value}" if lbl else f"{name} {value}")


    def first_float(s):
        m = re.search(r"-?\d+(?:\.\d+)?", s)
        return float(m.group()) if m else None


    def kv_page(text):
        """Parse the `name : value` rows of a pontop page."""
        out = {}
        for line in text.splitlines():
            if " : " in line:
                k, v = line.split(" : ", 1)
                out[k.strip()] = v.strip()
        return out


    def table_page(text):
        rows = []
        lines = text.splitlines()
        for line in lines[2:]:
            cols = line.split()
            if cols and cols[0].isdigit():
                rows.append(cols)
        return rows


    def collect():
        o = Out()
        t0 = time.time()
        try:
            status = json.loads(session.get(ADMIN + "gpon_status"))
            optical = kv_page(session.get(ADMIN + "pontop/optical"))
            fec = kv_page(session.get(ADMIN + "pontop/fec"))
            gtc = kv_page(session.get(ADMIN + "pontop/gtc"))
            gem = table_page(session.get(ADMIN + "pontop/gem_stats"))
        except Exception as e:  # noqa: BLE001 - any failure means the modem is not scrapable
            print("scrape failed:", repr(e), flush=True)
            session.opener = None
            o.add("modem_up", 0, "Whether the modem web UI was scraped successfully.")
            o.add("modem_scrape_duration_seconds", round(time.time() - t0, 3), "Scrape duration.")
            return "\n".join(o.lines) + "\n"

        o.add("modem_up", 1, "Whether the modem web UI was scraped successfully.")

        state = re.match(r"O(\d+)", status.get("status", ""))
        if state:
            o.add("modem_pon_state", int(state.group(1)), "PON ONU state: O1 (initial) to O5 (operation).")
        o.add("modem_info", 1, "Static modem information.",
              module=status.get("module_info", ""), pon_mode=status.get("pon_mode", ""),
              active_bank=status.get("active_bank", ""), ploam_status=status.get("status", ""))

        temps = [first_float(p) for p in status.get("temperature", "").split(" / ")]
        for sensor, v in zip(("cpu0", "cpu1", "transceiver"), temps):
            if v is not None:
                o.add("modem_temperature_celsius", v, "Temperature by sensor.", sensor=sensor)

        power = status.get("power", "").split(" / ")
        if len(power) == 3:
            rx, tx, bias = (first_float(p) for p in power)
            o.add("modem_optical_rx_power_dbm", rx, "Optical receive power.")
            o.add("modem_optical_tx_power_dbm", tx, "Optical transmit power.")
            o.add("modem_optical_tx_bias_amperes", bias / 1000, "Laser transmit bias current.")
        volt = first_float(status.get("voltage", ""))
        if volt is not None:
            o.add("modem_transceiver_voltage_volts", volt, "Transceiver supply voltage.")
        speed = first_float(status.get("eth_speed", ""))
        if speed is not None:
            o.add("modem_ethernet_link_speed_mbps", speed, "Negotiated Ethernet link speed.")

        o.add("modem_optical_rx_ok", int(optical.get("Receiver status") == "OK"),
              "1 when the receiver reports OK (no loss of signal).")
        o.add("modem_optical_tx_enabled", int(optical.get("Transmitter status", "").startswith("ENABLED")),
              "1 when the transmitter is enabled.")

        fec_counters = {
            "BIP errors": ("modem_pon_bip_errors_total", "Bit interleaved parity errors."),
            "Total FEC codewords": ("modem_pon_fec_codewords_total", "Downstream FEC codewords received."),
            "Corrected FEC codewords": ("modem_pon_fec_codewords_corrected_total", "FEC codewords corrected."),
            "Uncorrected FEC codewords": ("modem_pon_fec_codewords_uncorrected_total", "FEC codewords that could not be corrected."),
            "Corrected FEC bytes": ("modem_pon_fec_bytes_corrected_total", "Bytes corrected by FEC."),
            "FEC errored seconds": ("modem_pon_fec_errored_seconds_total", "Seconds containing FEC errors."),
        }
        for key, (name, help_) in fec_counters.items():
            v = first_float(fec.get(key, ""))
            if v is not None:
                o.add(name, int(v), help_, "counter")
        for direction in ("upstream", "downstream"):
            o.add("modem_pon_fec_enabled", int(fec.get(f"FEC {direction}") == "ON"),
                  "Whether FEC is enabled.", direction=direction)

        gtc_counters = {
            "PSBd HEC errors corrected": ("modem_pon_gtc_psbd_hec_corrected_errors_total", "Physical sync block HEC errors corrected."),
            "PSBd HEC errors uncorrected": ("modem_pon_gtc_psbd_hec_uncorrected_errors_total", "Physical sync block HEC errors uncorrected."),
            "FS HEC errors corrected": ("modem_pon_gtc_fs_hec_corrected_errors_total", "Frame sync HEC errors corrected."),
            "FS HEC errors uncorrected": ("modem_pon_gtc_fs_hec_uncorrected_errors_total", "Frame sync HEC errors uncorrected."),
            "Lost words due to HEC errors": ("modem_pon_gtc_lost_words_total", "Words lost to HEC errors."),
            "PLOAM MIC errors": ("modem_pon_gtc_ploam_mic_errors_total", "PLOAM message integrity check errors."),
        }
        for key, (name, help_) in gtc_counters.items():
            v = first_float(gtc.get(key, ""))
            if v is not None:
                o.add(name, int(v), help_, "counter")

        # Columns: index, gem id, u/s packets, u/s bytes, d/s packets, d/s bytes, key errors.
        for row in gem:
            if len(row) < 7:
                continue
            gem_id = row[1]
            for name, idx, help_ in (
                ("modem_gem_upstream_packets_total", 2, "Upstream GEM port packets."),
                ("modem_gem_upstream_bytes_total", 3, "Upstream GEM port bytes."),
                ("modem_gem_downstream_packets_total", 4, "Downstream GEM port packets."),
                ("modem_gem_downstream_bytes_total", 5, "Downstream GEM port bytes."),
                ("modem_gem_key_errors_total", 6, "GEM port encryption key errors."),
            ):
                o.add(name, int(row[idx]), help_, "counter", gem_id=gem_id)

        o.add("modem_scrape_duration_seconds", round(time.time() - t0, 3), "Scrape duration.")
        return "\n".join(o.lines) + "\n"


    def metrics():
        global cache
        with lock:
            ts, body = cache
            if time.time() - ts > CACHE_TTL:
                body = collect()
                cache = (time.time(), body)
            return body


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):  # noqa: N802
            if self.path == "/metrics":
                body, code = metrics().encode(), 200
            elif self.path == "/healthz":
                body, code = b"ok\n", 200
            else:
                body, code = b"not found\n", 404
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", int(os.environ.get("PORT", "9877"))), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modem-exporter
  namespace: service
  labels:
    app.kubernetes.io/name: modem-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: modem-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: modem-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.14.10-alpine3.24
          command: ["python3", "-I", "/app/exporter.py"]
          env:
            - name: MODEM_URL
              # modem.local is mDNS and does not resolve inside the cluster.
              value: http://192.168.0.200
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: modem-credentials
          ports:
            - name: metrics
              containerPort: 9877
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: modem-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: modem-exporter
  namespace: service
  labels:
    app.kubernetes.io/name: modem-exporter
spec:
  selector:
    app.kubernetes.io/name: modem-exporter
  ports:
    - name: metrics
      port: 9877
      targetPort: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: modem-exporter
  namespace: manager
spec:
  namespaceSelector:
    matchNames: [service]
  selector:
    matchLabels:
      app.kubernetes.io/name: modem-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: modem
  namespace: manager
spec:
  groups:
    - name: modem
      rules:
        - alert: ModemDown
          expr: modem_up == 0 or absent(modem_up)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Modem web UI cannot be scraped (modem down, credentials rejected, or exporter down)"
        - alert: ModemPonNotOperational
          expr: modem_pon_state != 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Modem PON state is O{{ $value }}, not O5 (operation): no uplink to the OLT"
        - alert: ModemOpticalRxLoss
          expr: modem_optical_rx_ok == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Modem reports loss of optical signal (check the fibre and connector)"
        - alert: ModemOpticalRxPowerLow
          expr: modem_optical_rx_power_dbm < -26
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Modem optical Rx power is {{ $value }} dBm (XGS-PON N1 sensitivity is -28 dBm)"
        - alert: ModemOpticalRxPowerHigh
          expr: modem_optical_rx_power_dbm > -9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Modem optical Rx power is {{ $value }} dBm (XGS-PON N1 overload is -8 dBm)"
        - alert: ModemFecUncorrected
          expr: increase(modem_pon_fec_codewords_uncorrected_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Modem saw {{ $value | humanize }} uncorrectable FEC codewords in 10m (data loss on the PON)"
        - alert: ModemPonErrors
          expr: |
            increase(modem_pon_gtc_fs_hec_uncorrected_errors_total[10m])
            + increase(modem_pon_gtc_psbd_hec_uncorrected_errors_total[10m])
            + increase(modem_pon_gtc_lost_words_total[10m])
            + increase(modem_pon_gtc_ploam_mic_errors_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Modem is logging uncorrected GTC/PLOAM errors on the PON"
        - alert: ModemGemKeyErrors
          expr: increase(modem_gem_key_errors_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "GEM port {{ $labels.gem_id }} has encryption key errors"
        - alert: ModemTransceiverHot
          expr: modem_temperature_celsius{sensor="transceiver"} > 75
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Modem optical transceiver is at {{ $value }} C"
        - alert: ModemCpuHot
          expr: modem_temperature_celsius{sensor=~"cpu.*"} > 95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Modem {{ $labels.sensor }} is at {{ $value }} C"
        - alert: ModemEthernetLinkDegraded
          expr: modem_ethernet_link_speed_mbps < 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Modem Ethernet link negotiated {{ $value }} Mbps instead of 10000"
---
