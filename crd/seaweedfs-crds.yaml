apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: seaweedfs-crds
spec:
  url: https://seaweedfs.github.io/seaweedfs-operator/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: seaweedfs-crds
spec:
  chart: seaweedfs-operator
  sourceRef:
    kind: HelmRepository
    name: seaweedfs-crds
  version: "^0.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-crds
spec:
  chartRef:
    kind: HelmChart
    name: seaweedfs-crds
  values:
    crds:
      create: true
  postRenderers:
    - kustomize:
        patches:
          - target: {}
            patch: |
              - op: add
                path: /metadata/annotations/delete
                value: "1"
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: remove
                path: /metadata/annotations/delete
          - target:
              annotationSelector: "delete=1"
            patch: |
              kind: unused
              metadata:
                name: unused
              $patch: delete
