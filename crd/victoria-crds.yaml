apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-crds
spec:
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator-crds
  ref:
    # Must track the operator version in infra/victoria.yaml (0.13.x ships CRDs for operator v0.73.x).
    # Stale CRDs prune status.lastAppliedSpec and send every VM CR into a reconcile loop.
    semver: "^0.13"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-crds
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-crds
