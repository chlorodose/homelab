apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: snapshot-crds
spec:
  url: oci://ghcr.io/piraeusdatastore/helm-charts/snapshot-controller
  ref:
    semver: "^5.4"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-crds
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-crds
  values:
    installCRDs: true
    keepCRDs: true
    controller:
      enabled: false
