apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium-crds
spec:
  url: oci://quay.io/cilium/charts/cilium
  ref:
    semver: "^1.20"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-crds
spec:
  chartRef:
    kind: OCIRepository
    name: cilium-crds
  postRenderers:
    - kustomize:
        patches:
          - target: {}
            patch: |
              - op: add
                path: /metadata/annotations/delete
                value: "1"
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: remove
                path: /metadata/annotations/delete
          - target:
              annotationSelector: "delete=1"
            patch: |
              kind: unused
              metadata:
                name: unused
              $patch: delete
