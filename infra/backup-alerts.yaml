# Alertmanager currently routes to "blackhole": these show up in vmalert/Grafana only.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kanidm-backup-archive
  namespace: manager
spec:
  groups:
    - name: kanidm-backup-archive
      rules:
        - alert: KanidmBackupArchiveStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="service", cronjob="kanidm-backup-archive"} > 26 * 3600
            or absent(kube_cronjob_status_last_successful_time{namespace="service", cronjob="kanidm-backup-archive"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Kanidm backup archive CronJob has not succeeded in 26h"
        - alert: KanidmBackupArchiveJobFailed
          expr: kube_job_status_failed{namespace="service", job_name=~"kanidm-backup-archive-.*"} > 0
          labels:
            severity: warning
          annotations:
            summary: "Kanidm backup archive job {{ $labels.job_name }} failed"
---
# vmalert instance for LogsQL rules (VictoriaLogs datasource).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vlogs
  namespace: manager
spec:
  datasource:
    url: http://vlselect-vlogs.database.svc:9471
  notifiers:
    - url: http://vmalertmanager-monitoring-victoria-metrics-k8s-stack.manager.svc:9093
  remoteWrite:
    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.manager.svc:8428
  remoteRead:
    url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.manager.svc:8428
  evaluationInterval: 5m
  ruleNamespaceSelector: {}
  ruleSelector:
    matchLabels:
      alert-datasource: vlogs
  extraArgs:
    rule.defaultRuleType: vlogs
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kanidm-online-backup
  namespace: manager
  labels:
    alert-datasource: vlogs
spec:
  groups:
    - name: kanidm-online-backup
      type: vlogs
      interval: 10m
      rules:
        - alert: KanidmOnlineBackupMissing
          expr: >-
            _time:26h kubernetes.pod_namespace:service kubernetes.pod_name:kanidm-0
            "Online backup created" | stats count() as backups | filter backups:<1
          labels:
            severity: warning
          annotations:
            summary: "Kanidm online_backup has not logged a successful backup in 26h"
