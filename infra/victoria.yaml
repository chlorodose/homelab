apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria
spec:
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
  ref:
    semver: "^0.66"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria
spec:
  chartRef:
    kind: OCIRepository
    name: victoria
  targetNamespace: manager
  values:
    crds:
      enabled: false
    logLevel: error # to emit spam warning
    operator:
      disable_prometheus_converter: false
      enable_converter_ownership: true
    serviceMonitor:
      enabled: true
      vm: false
---
apiVersion: operator.victoriametrics.com/v1
kind: VLCluster
metadata:
  name: vlogs
  namespace: database
spec:
  vlinsert:
    replicaCount: 1
    syslogSpec:
      tcpListeners:
        # Plain TCP; TLS is terminated at the gateway (syslog.internal.lilith-aster.me:6514)
        - listenPort: 5140
  vlselect:
    replicaCount: 1
  vlstorage:
    retentionPeriod: "24w"
    replicaCount: 1
    storage:
      volumeClaimTemplate:
        metadata:
          name: volume
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: proxmox-nvram
          resources:
            requests:
              storage: 128Gi
---
apiVersion: operator.victoriametrics.com/v1
kind: VLAgent
metadata:
  name: kube-logs-agent
  namespace: kube-system
spec:
  k8sCollector:
    enabled: true
    decolorizeFields:
      - _msg
  remoteWrite:
    - url: "http://vlinsert-vlogs.database.svc:9481/internal/insert"
  tolerations:
    - operator: Exists
      key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
    - operator: Exists
      effect: PreferNoSchedule
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: from-gateway-to-vlinsert
  namespace: database
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: manager
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: manager
  to:
    - group: ""
      kind: Service
      name: vlinsert-vlogs
    - group: ""
      kind: Service
      name: vlselect-vlogs
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: vlogs-syslog
  namespace: manager
spec:
  parentRefs:
    - name: default
      sectionName: syslog
  rules:
    - name: route
      backendRefs:
        - name: vlinsert-vlogs
          namespace: database
          kind: Service
          port: 5140
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vlogs-ui
  namespace: manager
spec:
  parentRefs:
    - name: default
  hostnames:
    - vlogs.internal.lilith-aster.me
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /select/vmui/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vlselect-vlogs
          namespace: database
          kind: Service
          port: 9471
