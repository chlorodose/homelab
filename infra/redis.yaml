apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: redis
spec:
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  ref:
    semver: "^1.5"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  targetNamespace: manager
  chartRef:
    kind: OCIRepository
    name: redis
  values:
    serviceMonitor:
      enabled: true
      rbacProxyMetricsReader:
        create: true
        serviceAccountName: vmagent-monitoring-victoria-metrics-k8s-stack
        serviceAccountNamespace: kube-system
    grafanaDashboard:
      enabled: true
    crds:
      install: false
---
# The operator's ServiceMonitor covers only the operator itself; scrape each
# Dragonfly instance's admin port (9999, /metrics) for the Dragonfly dashboard,
# whose variables use the pod's `app` label.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: dragonfly-instances
  namespace: manager
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  podTargetLabels:
    - app
  podMetricsEndpoints:
    - port: admin
      path: /metrics
