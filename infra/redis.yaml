apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: redis
spec:
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
  ref:
    semver: "^1.5"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
spec:
  targetNamespace: manager
  chartRef:
    kind: OCIRepository
    name: redis
  values:
    serviceMonitor:
      enabled: true
      rbacProxyMetricsReader:
        create: true
        serviceAccountName: vmagent-monitoring-victoria-metrics-k8s-stack
        serviceAccountNamespace: manager
    grafanaDashboard:
      enabled: true
    crds:
      install: false
